version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: local_minio
    ports:
      - "9000:9000"  # Порт для S3 API (подключение Spark)
      - "9001:9001"  # Порт для веб-панели управления (MinIO Console)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data: